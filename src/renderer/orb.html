<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'">
<style>
  /* The desktop orb — Donna's living-gradient identity, loose on your screen.
     Two states: collapsed (just the sphere, draggable, click to expand) and
     expanded (small chat, same pattern as the app's compact/pill morph). */
  :root {
    --bg: oklch(0.08 0.006 250 / 94%); --line: oklch(1 0 0 / 10%);
    --ink: oklch(0.955 0.005 250); --mut: oklch(0.72 0.012 250); --dim: oklch(0.56 0.014 250);
    --signal: oklch(0.76 0.12 250);
    --sans: Geist, -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body { display: flex; flex-direction: column; font: 400 13px var(--sans); color: var(--ink); }

  .drag { -webkit-app-region: drag; }
  .nodrag { -webkit-app-region: no-drag; }

  /* ── collapsed: just the sphere ── */
  #collapsed { flex: 1; display: flex; align-items: center; justify-content: center; }
  #collapsed.hidden { display: none; }
  .orb-wrap { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .orb-big {
    width: 44px; height: 44px; border-radius: 50%; position: relative;
    background:
      conic-gradient(from 0deg at 50% 50%,
        oklch(0.78 0.16 250) 0deg,
        oklch(0.72 0.18 290) 90deg,
        oklch(0.82 0.13 200) 180deg,
        oklch(0.74 0.16 340) 270deg,
        oklch(0.78 0.16 250) 360deg);
    box-shadow:
      0 0 24px oklch(0.72 0.15 262 / 55%),
      inset 0 0 12px oklch(0.95 0.08 250 / 40%),
      inset 0 -8px 16px oklch(0.4 0.2 290 / 50%),
      0 4px 18px oklch(0 0 0 / 45%);
    animation: orb-breathe 4.5s ease-in-out infinite, orb-spin 18s linear infinite;
  }
  .orb-big::before { /* inner highlight, painted on top of the conic for depth */
    content: ""; position: absolute; inset: 8%; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, oklch(0.95 0.06 250 / 85%), transparent 50%);
    pointer-events: none; mix-blend-mode: screen;
  }
  .orb-big::after { /* halo — pulses on its own clock for ambient life */
    content: ""; position: absolute; inset: -22%; border-radius: 50%;
    background: radial-gradient(circle, oklch(0.72 0.15 262 / 38%), transparent 60%);
    animation: orb-halo 6s ease-in-out infinite;
    pointer-events: none; z-index: -1;
  }
  /* reflection — a soft pool of light underneath, like the orb is sitting on a
     backlit surface. Gives the sphere weight and grounds it on the desktop. */
  .orb-wrap { position: relative; }
  .orb-wrap::after { content: ""; position: absolute; left: 50%; bottom: 6px;
    transform: translateX(-50%); width: 60px; height: 14px; border-radius: 50%;
    background: radial-gradient(ellipse at center, oklch(0.72 0.15 262 / 22%), transparent 70%);
    filter: blur(6px); pointer-events: none; z-index: -1;
    animation: orb-reflect 4.5s ease-in-out infinite; }
  @keyframes orb-reflect { 0%, 100% { opacity: 0.6; transform: translateX(-50%) scaleX(1); } 50% { opacity: 0.9; transform: translateX(-50%) scaleX(1.1); } }
  .orb-big.thinking { animation-duration: 1.4s, 6s; transform: scale(1.06); }
  .orb-big.thinking::after { animation-duration: 1.6s; }
  .orb-big.speaking { animation: orb-breathe 1.8s ease-in-out infinite, orb-spin 8s linear infinite; }
  @keyframes orb-breathe {
    0%, 100% { box-shadow: 0 0 24px oklch(0.72 0.15 262 / 42%), inset 0 0 12px oklch(0.95 0.08 250 / 34%), inset 0 -8px 16px oklch(0.4 0.2 290 / 50%), 0 4px 18px oklch(0 0 0 / 45%); transform: scale(1); }
    50% { box-shadow: 0 0 34px oklch(0.72 0.15 262 / 72%), inset 0 0 16px oklch(0.95 0.08 250 / 52%), inset 0 -8px 16px oklch(0.4 0.2 290 / 50%), 0 4px 18px oklch(0 0 0 / 45%); transform: scale(1.04); }
  }
  @keyframes orb-spin { to { filter: hue-rotate(360deg); } }
  @keyframes orb-halo {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.18); opacity: 0.85; }
  }

  /* ── expanded: mini chat ── */
  #expanded { flex: 1; display: none; flex-direction: column; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg); backdrop-filter: blur(16px); overflow: hidden; }
  #expanded.on { display: flex; }
  .ex-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 12px; }
  .ex-head .orb-sm { width: 10px; height: 10px; border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, oklch(0.9 0.08 250), oklch(0.6 0.16 270));
    animation: orb-breathe 4.5s ease-in-out infinite; flex-shrink: 0; }
  .ex-title { flex: 1; font: 600 12.5px var(--sans); color: var(--mut); }
  .ex-btn { -webkit-app-region: no-drag; border: none; background: transparent; color: var(--dim); cursor: pointer;
    width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .ex-btn:hover { background: oklch(1 0 0 / 8%); color: var(--ink); }
  #thread { flex: 1; overflow-y: auto; padding: 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { font-size: 12.5px; line-height: 1.45; max-width: 92%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; background: oklch(0.76 0.12 250 / 18%); }
  .msg.her { align-self: flex-start; background: oklch(1 0 0 / 6%); color: var(--mut); }
  .ex-empty { margin: auto; text-align: center; color: var(--dim); font-size: 12px; padding: 0 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ex-sugg { border: 1px solid var(--line); background: oklch(1 0 0 / 4%); border-radius: 10px; padding: 8px 12px;
    cursor: pointer; font-size: 11.5px; color: var(--mut); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; -webkit-app-region: no-drag; }
  .ex-sugg:hover { color: var(--ink); border-color: oklch(0.76 0.12 250 / 45%); }
  .ex-modes { display: flex; gap: 5px; padding: 0 10px 6px; -webkit-app-region: no-drag; }
  .ex-mode { flex: 1; border: 1px solid var(--line-soft, var(--line)); background: transparent; color: var(--dim); font: 500 10.5px var(--sans);
    padding: 4px 0; border-radius: 7px; cursor: pointer; }
  .ex-mode.on { color: var(--ink); border-color: oklch(0.76 0.12 250 / 55%); background: oklch(0.76 0.12 250 / 14%); }
  .ex-field { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 8px 10px; -webkit-app-region: no-drag; }
  .ex-field input { flex: 1; border: none; outline: none; background: transparent; color: var(--ink); font: 400 12.5px var(--sans); }
  .ex-field input::placeholder { color: var(--dim); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: oklch(1 0 0 / 14%); border-radius: 4px; }
</style>
</head>
<body class="drag">
  <div id="collapsed" class="drag"><div class="orb-wrap nodrag" id="orb-click"><div class="orb-big" id="orb-big"></div></div></div>
  <div id="expanded">
    <div class="ex-head drag">
      <span class="orb-sm"></span><span class="ex-title">Donna</span>
      <button class="ex-btn" id="ex-collapse" title="Collapse">⤡</button>
    </div>
    <div id="thread"><div class="ex-empty"><span>Ask me anything — I'll answer right here.</span><button class="ex-sugg" id="ex-sugg"></button></div></div>
    <div class="ex-modes" id="ex-modes"><button class="ex-mode" data-mode="quick">⚡ quick</button><button class="ex-mode" data-mode="think">◐ think</button><button class="ex-mode" data-mode="best">✦ best</button></div>
    <div class="ex-field"><input id="ex-in" placeholder="Ask Donna…"></div>
  </div>
<script src="orb.js"></script>
</body>
</html>
